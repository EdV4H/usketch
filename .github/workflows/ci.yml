name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify required documents exist
        run: |
          echo "Checking required v2 documents..."
          files=(
            "README.md"
            "docs/postmortem.md"
            "docs/new-product-proposal.md"
            "docs/architecture-v2.md"
            "docs/plugin-system-design.md"
            "docs/use-cases.md"
            "docs/roadmap.md"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              missing=1
            else
              echo "✅ Found: $f"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "::error::Required documents are missing"
            exit 1
          fi
          echo "All required documents present."
