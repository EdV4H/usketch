name: Release

on:
  push:
    branches: [main]

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_NO_DAEMON: 1

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
          scope: "@edv4h"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm Trusted Publishing (OIDC): no long-lived NPM_TOKEN. Auth is a short-lived
      # GitHub OIDC token (see `permissions.id-token: write` above). Each published
      # package must have a Trusted Publisher configured on npmjs.com pointing at this
      # repo + workflow. `changeset publish` shells out to `npm publish`, which needs
      # npm >= 11.5.1 to detect the OIDC environment, so upgrade the global npm here.
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@latest

      - name: Create Release PR or Publish to npm
        id: changesets
        # `changeset publish` pushes each package's git tag with a separate
        # `git push origin <tag>` call. On a large batch (80+ packages) these
        # rapid consecutive pushes intermittently trip GitHub's
        # "remote: fatal error in commit_refs", which fails the step with some
        # tags/releases left uncreated even though npm publish fully succeeded.
        # Tolerate the failure here and reconcile below in a single batched push.
        continue-on-error: true
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm release
          pr-title: "🎉 release: Version Packages"
          commit-message: "🎉 release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN / NPM_TOKEN — npm authenticates via GitHub OIDC
          # (trusted publishing). A stale token here would be tried before OIDC.

      # Reconcile any tags that changeset publish created locally but failed to
      # push. A single batched `git push --tags` (retried) replaces the ~80
      # individual pushes and reliably lands the stragglers. Only tags missing on
      # the remote are pushed: a tag the action already pushed (possibly as a
      # different object) would otherwise reject the whole batch as "already exists".
      - name: Reconcile git tags
        if: always()
        run: |
          mapfile -t pending < <(comm -23 \
            <(git tag --list | sort) \
            <(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | sort))
          if [ "${#pending[@]}" -eq 0 ]; then
            echo "all tags already on origin"
            exit 0
          fi
          printf 'pushing missing tag: %s\n' "${pending[@]}"
          n=0
          until git push origin "${pending[@]/#/refs/tags/}"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::failed to push tags after $n attempts"
              exit 1
            fi
            echo "tag push failed (attempt $n); retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      # changesets/action creates one GitHub Release per published package, but
      # aborts partway when the publish step errors on the tag push above. Ensure
      # a release exists for every tag on the release commit.
      - name: Reconcile GitHub Releases
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          for tag in $(git tag --points-at HEAD); do
            if gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi
            echo "creating missing GitHub Release: $tag"
            notes=""
            pkg_dir=$(git ls-files '*/package.json' | while read -r f; do
              name=$(node -p "require('./$f').name" 2>/dev/null || true)
              if [ "$name@$(node -p "require('./$f').version" 2>/dev/null)" = "$tag" ]; then
                dirname "$f"
                break
              fi
            done)
            if [ -n "$pkg_dir" ] && [ -f "$pkg_dir/CHANGELOG.md" ]; then
              ver="${tag##*@}"
              notes=$(awk -v v="## $ver" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f{print}' "$pkg_dir/CHANGELOG.md")
            fi
            [ -z "$notes" ] && notes="Automated release for $tag"
            gh release create "$tag" --title "$tag" --notes "$notes" --verify-tag
          done

      # Only the tag push is tolerated above. If the changesets step failed for
      # any other reason (e.g. npm publish actually failed), fail the job — and
      # say exactly which packages are still missing from npm.
      - name: Verify publish succeeded
        if: ${{ always() && steps.changesets.outcome == 'failure' }}
        run: |
          # Primary signal: the action's own `published` output.
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "npm publish succeeded (published=true); the step failure was the transient tag push, now reconciled."
            exit 0
          fi

          # The `commit_refs` tag-push failure can abort the changesets action
          # *before* it sets `published`, even though `changeset publish` already
          # finished publishing to npm. Use the registry as ground truth: every
          # non-private workspace package must have its current version on npm.
          # This also covers re-runs on non-release commits, where packages left
          # unpublished by an earlier failed run are retried.
          missing=()
          while IFS=$'\t' read -r name ver; do
            if [ -z "$(npm view "$name@$ver" version 2>/dev/null)" ]; then
              missing+=("$name@$ver")
            fi
          done < <(pnpm -r ls --json --depth -1 | node -e '
            for (const p of JSON.parse(require("fs").readFileSync(0, "utf8")))
              if (!p.private && p.name && p.version) console.log(`${p.name}\t${p.version}`);
          ')

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "published output was unset, but every public package version is on npm — npm publish succeeded."
            exit 0
          fi

          {
            echo "### ❌ npm publish incomplete"
            echo
            echo "Not on npm yet (${#missing[@]}):"
            echo
            printf -- '- `%s`\n' "${missing[@]}"
            echo
            echo "A \`404 Not Found\` from \`npm publish\` under OIDC usually means the package has no"
            echo "Trusted Publisher on npmjs.com (Settings → Trusted Publisher → GitHub Actions:"
            echo "\`EdV4H/usketch\` / \`release.yml\`). Fix that, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::publish incomplete — not on npm: ${missing[*]}"
          exit 1
