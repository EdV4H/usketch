packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "examples/*"

# pnpm 11 removed `onlyBuiltDependencies` / `ignoredBuiltDependencies` and
# replaced them with the `allowBuilds` map, and `strictDepBuilds` now defaults
# to true, so every dependency with a build script must be listed explicitly or
# the install fails with ERR_PNPM_IGNORED_BUILDS.
# This is a 1:1 migration of the previous configuration -- only @j178/prek is
# allowed to run its build (as before); the rest keep being skipped, which is
# the behaviour CI has always been green with.
allowBuilds:
  "@j178/prek": true
  "@openuidev/lang-core": false
  esbuild: false
  workerd: false

# @openuidev/* (thesysdev) is on a rapid 0.x cadence (new minors every few days).
# The global ~/.npmrc default `min-release-age` blocks installation of those
# fresh versions. Bypass the gate for this scope so the OpenUI shape plugin
# can pin to a verified release. Re-evaluate when @openuidev hits 1.0.
minimumReleaseAgeExclude:
  - "@openuidev/react-lang"
  - "@openuidev/react-headless"
  - "@openuidev/lang-core"
