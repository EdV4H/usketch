packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "examples/*"

onlyBuiltDependencies:
  - "@j178/prek"

# pnpm 12 turns "ignored build scripts" from a warning into a hard
# ERR_PNPM_IGNORED_BUILDS failure. These packages' postinstall scripts have
# never been run in this repo (pnpm <=11 silently skipped them and CI is green
# that way), so list them explicitly to preserve the existing behaviour rather
# than newly enabling their scripts.
ignoredBuiltDependencies:
  - "@openuidev/lang-core"
  - "esbuild"
  - "workerd"

# @openuidev/* (thesysdev) is on a rapid 0.x cadence (new minors every few days).
# The global ~/.npmrc default `min-release-age` blocks installation of those
# fresh versions. Bypass the gate for this scope so the OpenUI shape plugin
# can pin to a verified release. Re-evaluate when @openuidev hits 1.0.
minimumReleaseAgeExclude:
  - "@openuidev/react-lang"
  - "@openuidev/react-headless"
  - "@openuidev/lang-core"
