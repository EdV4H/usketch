name = "usketch-server"
compatibility_date = "2024-12-01"
main = "src/index.ts"

[vars]
DEV_MODE = "true"

[[d1_databases]]
binding = "DB"
database_name = "usketch-db"
database_id = "local"

[durable_objects]
bindings = [
	{ name = "BOARD_ROOM", class_name = "BoardRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["BoardRoom"]
