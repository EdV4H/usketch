name = "usketch-server"
compatibility_date = "2024-12-01"
main = "src/index.ts"

[[d1_databases]]
binding = "DB"
database_name = "usketch-db"
database_id = "00000000-0000-0000-0000-000000000000" # デプロイ時に実際のIDに置き換え

[durable_objects]
bindings = [
	{ name = "BOARD_ROOM", class_name = "BoardRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["BoardRoom"]
